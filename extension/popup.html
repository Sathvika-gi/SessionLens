<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SessionLens</title>
  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: rgba(17, 24, 39, 0.7);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-color: #e5e7eb;
      --text-muted: #9ca3af;
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.15);
      --success: #10b981;
      --info: #3b82f6;
      --warning: #f59e0b;
      --danger: #ef4444;
    }

    body {
      width: 340px;
      margin: 0;
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      box-sizing: border-box;
      overflow-x: hidden;
    }

    .container {
      padding: 16px;
      background: radial-gradient(circle at top right, rgba(99, 102, 241, 0.08), transparent 70%);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      margin-bottom: 16px;
    }

    .logo-container {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .logo-icon {
      width: 24px;
      height: 24px;
      background: linear-gradient(135deg, #6366f1, #a855f7);
      border-radius: 6px;
      box-shadow: 0 0 10px rgba(99, 102, 241, 0.4);
    }

    h1 {
      font-size: 16px;
      margin: 0;
      font-weight: 600;
      background: linear-gradient(to right, #ffffff, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .version {
      font-size: 10px;
      color: var(--text-muted);
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
      backdrop-filter: blur(8px);
    }

    .status-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 8px;
    }

    .status-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 500;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--success);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--success);
    }

    .pulse {
      animation: pulse-animation 2s infinite;
    }

    @keyframes pulse-animation {
      0% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
      }
      70% {
        transform: scale(1);
        box-shadow: 0 0 0 6px rgba(16, 185, 129, 0);
      }
      100% {
        transform: scale(0.95);
        box-shadow: 0 0 0 0 rgba(16, 185, 129, 0);
      }
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 16px;
    }

    .stat-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px;
      text-align: center;
    }

    .stat-val {
      font-size: 18px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 2px;
    }

    .stat-label {
      font-size: 10px;
      color: var(--text-muted);
      text-transform: uppercase;
    }

    .log-section {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }

    .log-title {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-bottom: 10px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .clear-btn {
      background: none;
      border: none;
      color: var(--primary);
      cursor: pointer;
      font-size: 10px;
      font-weight: 600;
      padding: 2px 6px;
      border-radius: 4px;
      transition: background 0.2s;
    }

    .clear-btn:hover {
      background: rgba(99, 102, 241, 0.1);
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    /* Custom scrollbar */
    .log-list::-webkit-scrollbar {
      width: 4px;
    }
    .log-list::-webkit-scrollbar-track {
      background: transparent;
    }
    .log-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.1);
      border-radius: 2px;
    }

    .log-item {
      display: flex;
      flex-direction: column;
      padding: 8px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.01);
      border-left: 3px solid #6366f1;
      font-size: 11px;
    }

    .log-item.event-tab_activated {
      border-left-color: var(--info);
    }

    .log-item.event-url_updated {
      border-left-color: var(--success);
    }

    .log-item.event-tab_closed {
      border-left-color: var(--danger);
    }

    .log-header {
      display: flex;
      justify-content: space-between;
      margin-bottom: 4px;
    }

    .log-badge {
      font-size: 9px;
      padding: 1px 5px;
      border-radius: 4px;
      font-weight: 600;
      text-transform: uppercase;
    }

    .badge-tab_activated {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
    }

    .badge-url_updated {
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
    }

    .badge-tab_closed {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    .log-time {
      color: var(--text-muted);
      font-size: 9px;
    }

    .log-url {
      color: var(--text-color);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      font-weight: 500;
    }

    .log-title-text {
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .empty-state {
      text-align: center;
      padding: 20px 0;
      color: var(--text-muted);
      font-size: 12px;
      font-style: italic;
    }

    footer {
      text-align: center;
      font-size: 9px;
      color: var(--text-muted);
      margin-top: 8px;
    }

    /* Simple Toggle Switch styling */
    .switch {
      position: relative;
      display: inline-block;
      width: 38px;
      height: 20px;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: rgba(255, 255, 255, 0.1);
      transition: .3s;
      border: 1px solid var(--border-color);
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 2px;
      bottom: 2px;
      background-color: white;
      transition: .3s;
    }

    input:checked + .slider {
      background-color: var(--primary);
    }

    input:checked + .slider:before {
      transform: translateX(18px);
    }

    .slider.round {
      border-radius: 20px;
    }

    .slider.round:before {
      border-radius: 50%;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo-container">
        <div class="logo-icon"></div>
        <h1>SessionLens</h1>
      </div>
      <div class="version">v1.0.0</div>
    </header>

    <div class="status-card">
      <div class="status-header">
        <span class="status-title">Activity Tracking</span>
        <label class="switch">
          <input type="checkbox" id="tracking-toggle" checked>
          <span class="slider round"></span>
        </label>
      </div>
      <div class="status-indicator" style="margin-top: 8px; justify-content: flex-start; gap: 8px;">
        <div class="pulse-dot pulse" id="status-dot"></div>
        <span id="status-text">Tracking Active</span>
      </div>
    </div>

    <div class="stats-grid">
      <div class="stat-box">
        <div class="stat-val" id="stat-total-events">0</div>
        <div class="stat-label">Total Events</div>
      </div>
      <div class="stat-box">
        <div class="stat-val" id="stat-last-event">-</div>
        <div class="stat-label">Last Action</div>
      </div>
    </div>

    <div class="log-section">
      <div class="log-title">
        <span>Activity Stream</span>
        <button id="clear-logs-btn" class="clear-btn">Clear Logs</button>
      </div>
      <ul class="log-list" id="activity-log-list">
        <li class="empty-state">No activities recorded yet</li>
      </ul>
    </div>

    <footer>
      Visual Browser Activity Monitor MVP
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
